[package]
name = "desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "entropybox"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
entropybox-starter-simulation = { workspace = true }

[features]
default = ["dev"]
dev = ["bevy/bevy_dev_tools"]
fast-link = ["bevy/dynamic_linking"]

[lints]
workspace = true
