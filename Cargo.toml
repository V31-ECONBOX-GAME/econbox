[workspace]
resolver = "3"
members = ["library/*", "module/*", "starter/*", "desktop", "ios", "integration-test/*", "buildsrc"]
default-members = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
config_rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
core = { path = "library/core" }
world = { path = "module/world" }
population = { path = "module/population" }
society = { path = "module/society" }
economy = { path = "module/economy" }
finance = { path = "module/finance" }
politics = { path = "module/politics" }
debug = { path = "module/debug" }
simulation = { path = "starter/simulation" }
desktop = { path = "desktop" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
