[workspace]
resolver = "3"
members = ["library/*", "module/*", "starter/*", "boot", "integration-test/*", "buildsrc"]
default-members = ["boot"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
econbox_core = { path = "library/core", package = "core" }
econbox_config = { path = "library/config", package = "config" }
econbox_world = { path = "module/world", package = "world" }
econbox_population = { path = "module/population", package = "population" }
econbox_society = { path = "module/society", package = "society" }
econbox_economy = { path = "module/economy", package = "economy" }
econbox_finance = { path = "module/finance", package = "finance" }
econbox_politics = { path = "module/politics", package = "politics" }
econbox_debug = { path = "module/debug", package = "debug" }
econbox_simulation = { path = "starter/simulation", package = "simulation" }
econbox = { path = "boot", package = "boot" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
