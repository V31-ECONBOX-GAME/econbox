[workspace]
resolver = "3"
members = ["core/*", "module/*", "desktop", "ios", "integration-test/*", "buildsrc"]
default-members = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
config_rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
econbox = { path = "core/econbox" }
econbox-art = { path = "module/econbox-art" }
econbox-brush = { path = "module/econbox-brush" }
econbox-camera = { path = "module/econbox-camera" }
econbox-clock = { path = "module/econbox-clock" }
econbox-creature = { path = "module/econbox-creature" }
econbox-cursor = { path = "module/econbox-cursor" }
econbox-field = { path = "module/econbox-field" }
econbox-noise = { path = "module/econbox-noise" }
econbox-tile = { path = "module/econbox-tile" }
econbox-tilemap = { path = "module/econbox-tilemap" }
econbox-tileview = { path = "module/econbox-tileview" }
econbox-toolbar = { path = "module/econbox-toolbar" }
econbox-worldgen = { path = "module/econbox-worldgen" }
desktop = { path = "desktop" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
