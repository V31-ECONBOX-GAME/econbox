[workspace]
resolver = "3"
members = ["library/*", "module/*", "starter/*", "desktop", "ios", "integration-test/*", "buildsrc"]
default-members = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
config_rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
econbox_core = { path = "library/core", package = "core" }
econbox_world = { path = "module/world", package = "world" }
econbox_population = { path = "module/population", package = "population" }
econbox_society = { path = "module/society", package = "society" }
econbox_economy = { path = "module/economy", package = "economy" }
econbox_finance = { path = "module/finance", package = "finance" }
econbox_politics = { path = "module/politics", package = "politics" }
econbox_debug = { path = "module/debug", package = "debug" }
econbox_simulation = { path = "starter/simulation", package = "simulation" }
econbox = { path = "desktop", package = "desktop" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
