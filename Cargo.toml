[workspace]
resolver = "3"
members = ["core/*", "module/*", "starter/*", "desktop", "ios", "integration-test/*", "buildsrc"]
default-members = ["desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
config_rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
entropybox = { path = "core/entropybox" }
entropybox-world = { path = "module/entropybox-world" }
entropybox-population = { path = "module/entropybox-population" }
entropybox-society = { path = "module/entropybox-society" }
entropybox-economy = { path = "module/entropybox-economy" }
entropybox-finance = { path = "module/entropybox-finance" }
entropybox-politics = { path = "module/entropybox-politics" }
entropybox-starter = { path = "starter/entropybox-starter" }
entropybox-starter-simulation = { path = "starter/entropybox-starter-simulation" }
desktop = { path = "desktop" }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
